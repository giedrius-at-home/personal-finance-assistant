[package]
name = "finance-notify"
description = "Delivery for the daily spending email: SMTP (lettre, rustls) and the local Ollama writer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
finance-core.workspace = true
finance-secrets.workspace = true
finance-types.workspace = true
lettre = { version = "0.11.24", default-features = false, features = ["builder", "hostname", "smtp-transport", "rustls", "aws-lc-rs", "rustls-platform-verifier"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json"] }
serde_json.workspace = true

[lints]
workspace = true
