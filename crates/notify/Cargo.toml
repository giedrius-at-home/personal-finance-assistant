[package]
name = "finance-notify"
description = "Delivery: the daily spending email and alert emails over SMTP (lettre, rustls), Web Push to the phone, and the local Ollama writer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
finance-core.workspace = true
finance-secrets.workspace = true
finance-types.workspace = true
finance-mistral.workspace = true
aws-lc-rs = "1.18.2"
base64 = "0.23.1"
jiff = "0.2.38"
lettre = { version = "0.11.24", default-features = false, features = ["builder", "hostname", "smtp-transport", "rustls", "aws-lc-rs", "rustls-platform-verifier"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
serde_json.workspace = true

[lints]
workspace = true

[dev-dependencies]
finance-mistral = { workspace = true, features = ["fake"] }
