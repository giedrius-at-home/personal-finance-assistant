name: Release

# Builds, signs and publishes Finance.app as a new release after every push
# to main that passes CI (which also deploys the Oracle server), so the app
# and the server stay in step. It can also be started by hand (Actions ->
# Release -> Run workflow, or `gh workflow run release.yml`).
# The repository is public, so GitHub's macOS runners cost nothing. The
# installed app finds a release through latest.json and verifies the update
# signature.
#
# The version is the one in tauri.conf.json when a PR raised it past the
# latest release (minor and major bumps); otherwise the latest release's
# patch plus one, stamped into this build and the tag, not committed back.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One release at a time; while one builds, only the newest waiting push is
# kept (it contains the others).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  macos:
    # Only a push to main whose CI passed; never a pull request's run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The commit CI passed, not whatever main points at by now.
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: trunk@0.22.1,cargo-binstall
      - name: Install the Tauri CLI
        run: cargo binstall -y --locked tauri-cli@2.12.4

      - name: Pick the version
        run: |
          latest=$(gh release view --json tagName --jq .tagName 2>/dev/null || echo v0.0.0)
          LATEST="$latest" python3 - <<'PY'
          import json, os
          path = "app/src-tauri/tauri.conf.json"
          conf = json.load(open(path))
          parse = lambda v: tuple(int(p) for p in v.removeprefix("v").split("."))
          file, latest = parse(conf["version"]), parse(os.environ["LATEST"])
          version = file if file > latest else (latest[0], latest[1], latest[2] + 1)
          conf["version"] = ".".join(map(str, version))
          json.dump(conf, open(path, "w"), indent=2)
          open(os.environ["GITHUB_ENV"], "a").write(f"TAG=v{conf['version']}\n")
          print(f"latest {os.environ['LATEST']}, releasing v{conf['version']}")
          PY

      - name: Test
        run: cargo test --locked -p finance-storage -p finance-core

      - name: Build and sign
        working-directory: app/src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build --bundles app

      - name: Publish release
        run: |
          bundle=target/release/bundle
          gh release create "$TAG" --target "$SHA" --title "Finance $TAG" --generate-notes \
            "$bundle/macos/Finance.app.tar.gz" \
            "$bundle/macos/Finance.app.tar.gz.sig"

      - name: Publish latest.json
        run: |
          # API asset URLs, because the repository is private: the app sends
          # its token and Accept: application/octet-stream to download them.
          url=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            --jq '.assets[] | select(.name == "Finance.app.tar.gz") | .url')
          notes=$(gh release view "$TAG" --json body --jq .body)
          SIG="$(cat target/release/bundle/macos/Finance.app.tar.gz.sig)" URL="$url" NOTES="$notes" \
          python3 - <<'PY'
          import datetime, json, os
          entry = {"signature": os.environ["SIG"], "url": os.environ["URL"]}
          manifest = {
              "version": os.environ["TAG"].removeprefix("v"),
              "notes": os.environ["NOTES"],
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {"darwin-aarch64": entry, "darwin-aarch64-app": entry},
          }
          json.dump(manifest, open("latest.json", "w"), indent=2)
          PY
          gh release upload "$TAG" latest.json
