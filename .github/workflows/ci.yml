name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Everything except the Tauri shell builds on Linux; the shell is built on
    # macOS by the release workflow. Runs on the owner's own runner (the
    # Oracle server, user `dev`): no Actions minutes, and the build folder
    # stays between runs, so there is no cache step.
    runs-on: [self-hosted, linux, ARM64]
    env:
      CARGO_TARGET_DIR: /home/dev/ci-target
    steps:
      # The runner's disk is shared with dev's own builds; a full disk failed
      # every job at checkout. Before anything else, drop this job's
      # incremental cache, then its whole debug build, until 8 GiB are free.
      - name: Free disk space
        run: |
          avail() { df --output=avail -B1G / | tail -1 | tr -d ' '; }
          for dir in "$CARGO_TARGET_DIR/debug/incremental" "$CARGO_TARGET_DIR/debug"; do
            [ "$(avail)" -ge 8 ] && break
            echo "only $(avail) GiB free: removing $dir"
            rm -rf "$dir"
          done
          echo "$(avail) GiB free"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain from rust-toolchain.toml
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" show
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: |
          cargo clippy --locked -p finance-types -p finance-storage -p finance-core -p finance-migrate -p finance-secrets -p finance-bank -p finance-notify -p finance-timesfm -p finance-ai -p finance-mistral -p finance-devserver -p finance-server --all-targets -- -D warnings
          cargo clippy --locked -p finance-ui --target wasm32-unknown-unknown -- -D warnings
      - name: Test
        run: cargo test --locked -p finance-storage -p finance-types -p finance-core -p finance-bank -p finance-notify -p finance-timesfm -p finance-ai -p finance-mistral -p finance-server
      - name: UI logic tests
        run: cargo test --locked -p finance-ui --bins

  supply-chain:
    runs-on: [self-hosted, linux, ARM64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # cargo-deny is installed on the runner (app/server/README.md); the
      # Docker action it replaces cannot run there.
      - name: cargo deny
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/cargo" deny check advisories bans licenses sources

  deploy:
    # Every push to main that passes both jobs goes live on this server.
    # Never for pull requests. Builds in the runner's workspace (not dev's
    # ~/finance checkout, which may hold other work), stages the build in
    # /home/dev/deploy and runs dev's one root command, finance-deploy,
    # which installs it, restarts the service and rolls back if it does not
    # stay up (app/server/README.md).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, supply-chain]
    runs-on: [self-hosted, linux, ARM64]
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      CARGO_TARGET_DIR: /home/dev/deploy-target
      TRUNK: 0.22.1
    steps:
      # The runner's disk is shared with dev's own builds; a full disk failed
      # every job at checkout. Before anything else, drop this job's
      # incremental cache, then its whole debug build (release stays warm), until 8 GiB are free.
      - name: Free disk space
        run: |
          avail() { df --output=avail -B1G / | tail -1 | tr -d ' '; }
          for dir in "$CARGO_TARGET_DIR/debug/incremental" "$CARGO_TARGET_DIR/debug"; do
            [ "$(avail)" -ge 8 ] && break
            echo "only $(avail) GiB free: removing $dir"
            rm -rf "$dir"
          done
          echo "$(avail) GiB free"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain from rust-toolchain.toml
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" show
      - name: Trunk
        run: |
          trunk --version 2>/dev/null | grep -q "$TRUNK" || {
            echo "trunk $TRUNK is not installed for dev: run app/server/deploy/deploy-here.sh once" >&2; exit 1; }
      - name: Build
        run: |
          cargo build --release --locked -p finance-server
          (cd app/ui && trunk build --release)
      - name: Deploy
        run: |
          app/server/deploy/stage.sh "$CARGO_TARGET_DIR/release/finance-server" app/ui/dist
          sudo /usr/local/sbin/finance-deploy
