name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --all-extras --dev

      - name: Check formatting and lint
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Check types
        run: uv run mypy src scripts

      - name: Run security checks
        run: |
          uv run bandit -q -r src scripts
          uv run pip-audit

      - name: Run tests
        run: uv run pytest --cov=finance_assistant --cov-report=term-missing

      - name: Test dashboard interactions with synthetic DOM doubles
        run: node --test tests/javascript/dashboard.test.cjs

  container:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet

      - name: Build local image
        run: docker build --tag personal-finance-assistant:ci .

      - name: Test bank importer adapter with synthetic data and no network
        run: python scripts/check_bank_worker.py

      - name: Smoke-test the built dashboard container
        run: |
          docker run --detach --name pfa-smoke --publish 127.0.0.1:18000:8000 \
            --env PFA_DEMO_MODE=true personal-finance-assistant:ci
          trap 'docker rm --force pfa-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18000/ready >/dev/null
          curl --fail --silent http://127.0.0.1:18000/dashboard | \
            grep --quiet 'Invented demo data'
