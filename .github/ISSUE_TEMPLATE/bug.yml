name: Bug report
description: Report reproducible incorrect behaviour using synthetic data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Do not paste real transactions, credentials, account identifiers, or
        unredacted logs. Follow SECURITY.md for sensitive vulnerabilities.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken and what impact does it have?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Provide minimal steps and synthetic inputs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit, Python, OS, container, and relevant upstream versions.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Security and privacy impact
      description: State whether data exposure, integrity, authentication, or availability is affected.
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: The report contains only synthetic or redacted information.
          required: true
