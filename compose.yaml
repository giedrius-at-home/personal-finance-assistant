name: personal-finance-assistant

services:
  gateway:
    build:
      context: .
    environment:
      PFA_LOG_LEVEL: ${PFA_LOG_LEVEL:-INFO}
      PFA_OLLAMA_BASE_URL: ${PFA_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      PFA_OLLAMA_MODEL: ${PFA_OLLAMA_MODEL:-qwen3:8b}
      PFA_FIREFLY_BASE_URL: http://firefly:8080
      PFA_GHOSTFOLIO_BASE_URL: http://ghostfolio:3333
    ports:
      - "127.0.0.1:${PFA_GATEWAY_PORT:?Run make bootstrap}:8000"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - application

  firefly:
    image: fireflyiii/core:version-6.6.6@sha256:ae69fdd95cdef9038cd7a460a5aec731f14813973e4f096511d5a4ea9ff0e972
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      SITE_OWNER: ${FIREFLY_SITE_OWNER:?Run make bootstrap}
      APP_KEY: ${FIREFLY_APP_KEY:?Run make bootstrap}
      APP_URL: http://localhost:${PFA_FIREFLY_PORT:?Run make bootstrap}
      DEFAULT_LANGUAGE: en_US
      DEFAULT_LOCALE: equal
      TZ: ${PFA_TIMEZONE:?Run make bootstrap}
      LOG_CHANNEL: stdout
      APP_LOG_LEVEL: notice
      AUDIT_LOG_LEVEL: emergency
      DB_CONNECTION: mysql
      DB_HOST: firefly-db
      DB_PORT: "3306"
      DB_DATABASE: firefly
      DB_USERNAME: firefly
      DB_PASSWORD: ${FIREFLY_DB_PASSWORD:?Run make bootstrap}
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      TRUSTED_PROXIES: ""
      STATIC_CRON_TOKEN: ${FIREFLY_CRON_TOKEN:?Run make bootstrap}
    depends_on:
      firefly-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PFA_FIREFLY_PORT}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
    volumes:
      - firefly_upload:/var/www/html/storage/upload
    networks:
      - application
      - firefly_data

  firefly-db:
    image: mariadb:lts@sha256:dd9b303aed4f4890ed09f766d8ca9ddfd176c0c6f6267feff53b3192ec65a979
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_USER: firefly
      MYSQL_PASSWORD: ${FIREFLY_DB_PASSWORD:?Run make bootstrap}
      MYSQL_DATABASE: firefly
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - firefly_db:/var/lib/mysql
    networks:
      - firefly_data

  importer:
    image: fireflyiii/data-importer:version-2.3.4@sha256:26459e1f014544f1ae56d1beed9c6a0ddf208b1eaa24cf11fa77ebd1f51422c8
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stack
      LOG_LEVEL: warning
      LOG_RETURN_JSON: "false"
      FIREFLY_III_URL: http://firefly:8080
      VANITY_URL: http://localhost:${PFA_FIREFLY_PORT:?Run make bootstrap}
      TRUSTED_PROXIES: ""
      TZ: ${PFA_TIMEZONE:?Run make bootstrap}
      CAN_POST_AUTOIMPORT: "false"
      CAN_POST_FILES: "false"
      ENABLE_MAIL_REPORT: "false"
    depends_on:
      firefly:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PFA_IMPORTER_PORT:?Run make bootstrap}:8080"
    restart: unless-stopped
    networks:
      - application

  firefly-cron:
    image: alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
    environment:
      FIREFLY_CRON_TOKEN: ${FIREFLY_CRON_TOKEN:?Run make bootstrap}
      TZ: ${PFA_TIMEZONE:?Run make bootstrap}
    command:
      - sh
      - -ec
      - >-
        echo "0 3 * * * wget -qO- http://firefly:8080/api/v1/cron/$${FIREFLY_CRON_TOKEN}" |
        crontab - && exec crond -f -L /dev/stdout
    depends_on:
      firefly:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/spool/cron/crontabs:size=1m,mode=0700
    security_opt:
      - no-new-privileges:true
    networks:
      - application

  ghostfolio:
    image: ghostfolio/ghostfolio:3.65.0@sha256:5762d47097bb30f6e8c51a1a0ebd9a39798631b512d8a78223bcfe68202e5286
    environment:
      REDIS_HOST: ghostfolio-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${GHOSTFOLIO_REDIS_PASSWORD:?Run make bootstrap}
      POSTGRES_DB: ghostfolio-db
      POSTGRES_USER: ghostfolio
      POSTGRES_PASSWORD: ${GHOSTFOLIO_DB_PASSWORD:?Run make bootstrap}
      DATABASE_URL: postgresql://ghostfolio:${GHOSTFOLIO_DB_PASSWORD}@ghostfolio-db:5432/ghostfolio-db?connect_timeout=300
      ACCESS_TOKEN_SALT: ${GHOSTFOLIO_ACCESS_TOKEN_SALT:?Run make bootstrap}
      JWT_SECRET_KEY: ${GHOSTFOLIO_JWT_SECRET_KEY:?Run make bootstrap}
      ROOT_URL: http://localhost:${PFA_GHOSTFOLIO_PORT:?Run make bootstrap}
    depends_on:
      ghostfolio-db:
        condition: service_healthy
      ghostfolio-redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PFA_GHOSTFOLIO_PORT}:3333"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3333/api/v1/health')
          .then(response => { if (!response.ok) process.exit(1) })
          .catch(() => process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - application
      - ghostfolio_data

  ghostfolio-db:
    image: postgres:15-alpine@sha256:fe0737ba566a2c5b2a28f34433c0a423261900ec17b9bf7ad115e1aae7e57f1b
    environment:
      POSTGRES_DB: ghostfolio-db
      POSTGRES_USER: ghostfolio
      POSTGRES_PASSWORD: ${GHOSTFOLIO_DB_PASSWORD:?Run make bootstrap}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - ghostfolio_db:/var/lib/postgresql/data
    networks:
      - ghostfolio_data

  ghostfolio-redis:
    image: redis:alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    environment:
      REDISCLI_AUTH: ${GHOSTFOLIO_REDIS_PASSWORD:?Run make bootstrap}
    command: ["redis-server", "--requirepass", "${GHOSTFOLIO_REDIS_PASSWORD:?Run make bootstrap}"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - ghostfolio_data

volumes:
  firefly_db:
  firefly_upload:
  ghostfolio_db:

networks:
  application:
  firefly_data:
    internal: true
  ghostfolio_data:
    internal: true
