# cargo-deny: advisories, licences, duplicate and unknown sources.
[graph]
# Only what ships: the macOS app and its WASM UI.
targets = ["aarch64-apple-darwin", "wasm32-unknown-unknown"]

[advisories]
yanked = "deny"
ignore = [
    # paste: unmaintained compile-time macro pulled in by Leptos; no runtime code, no known vulnerability.
    { id = "RUSTSEC-2024-0436", reason = "build-time macro via leptos" },
]

[licenses]
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Zlib", "Unicode-3.0", "MPL-2.0", "CC0-1.0", "BSL-1.0", "0BSD", "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
