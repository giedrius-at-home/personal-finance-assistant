[package]
name = "finance-app"
description = "Finance: the native macOS app (Tauri shell around the Leptos UI)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "finance"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
finance-storage.workspace = true
finance-types.workspace = true
serde.workspace = true
tauri = { version = "2.12.5", features = ["macos-private-api"] }
window-vibrancy = "0.8.1"

[lints]
workspace = true
