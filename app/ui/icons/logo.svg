<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Finance: a rose-gold G coin on deep plum. Source of every app icon
       (render with any SVG renderer; sizes in app/ui/icons and
       app/src-tauri/icons). The coin stays inside the 80% safe zone, so
       the same image serves as a maskable icon. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A1736"/>
      <stop offset="1" stop-color="#1E0A1A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#F9A8D4" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#F9A8D4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0.2" y1="0.05" x2="0.8" y2="0.95">
      <stop offset="0" stop-color="#FFE1EA"/>
      <stop offset="0.45" stop-color="#F49AB8"/>
      <stop offset="1" stop-color="#B8456F"/>
    </linearGradient>
    <linearGradient id="rim" x1="0.8" y1="0.95" x2="0.2" y2="0.05">
      <stop offset="0" stop-color="#FFD3E0"/>
      <stop offset="1" stop-color="#8E2F55"/>
    </linearGradient>
    <linearGradient id="face" x1="0.25" y1="0.1" x2="0.75" y2="0.9">
      <stop offset="0" stop-color="#FBC2D4"/>
      <stop offset="1" stop-color="#E0789D"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="236" fill="url(#glow)"/>
  <!-- drop shadow -->
  <circle cx="262" cy="270" r="184" fill="#500724" opacity="0.4"/>
  <!-- coin body and ridged edge -->
  <circle cx="256" cy="256" r="184" fill="url(#gold)"/>
  <circle cx="256" cy="256" r="174" fill="none" stroke="#A33D66" stroke-width="12"
          stroke-dasharray="6 5.4" opacity="0.55"/>
  <!-- raised inner face -->
  <circle cx="256" cy="256" r="156" fill="url(#rim)"/>
  <circle cx="256" cy="256" r="148" fill="url(#face)"/>
  <!-- the G: shadow, then highlight, then the letter (embossed) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="40">
    <path d="M323 192 A92 92 0 1 0 348 256 L270 256" stroke="#7A2348" transform="translate(5 7)" opacity="0.55"/>
    <path d="M323 192 A92 92 0 1 0 348 256 L270 256" stroke="#FFF0F5" transform="translate(-3 -4)"/>
    <path d="M323 192 A92 92 0 1 0 348 256 L270 256" stroke="#B33E6B"/>
  </g>
  <!-- shine -->
  <ellipse cx="190" cy="160" rx="110" ry="46" fill="url(#shine)" transform="rotate(-35 190 160)"/>
</svg>
