[package]
name = "finance-ui"
description = "Finance UI: Leptos (client-side rendered, WASM) screens."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
finance-types.workspace = true
leptos = { version = "0.8.22", features = ["csr"] }
rust_decimal.workspace = true
serde.workspace = true
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3.106"
web-sys = { version = "0.3.106", features = ["HtmlElement", "HtmlInputElement", "KeyboardEvent", "Window", "Document", "Element", "ScrollIntoViewOptions", "ScrollLogicalPosition", "FileList"] }
console_error_panic_hook = "0.1.7"

[lints]
workspace = true
