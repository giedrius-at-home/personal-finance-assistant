[workspace]
resolver = "3"
members = ["crates/types", "crates/storage", "crates/migrate", "app/src-tauri", "app/ui", "app/devserver", "crates/secrets", "crates/core", "crates/bank", "crates/notify", "crates/timesfm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
finance-types = { path = "crates/types" }
finance-storage = { path = "crates/storage" }
finance-secrets = { path = "crates/secrets" }
finance-core = { path = "crates/core" }
finance-bank = { path = "crates/bank" }
finance-notify = { path = "crates/notify" }
finance-timesfm = { path = "crates/timesfm" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
rusqlite = { version = "0.41.0", features = ["bundled"] }
rust_decimal = { version = "1.43.0", features = ["serde-str"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
